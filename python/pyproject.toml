[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "kyrazo"
version = "1.2.0"
description = "Official Kyrazo SDK for Python. Build reliable event-driven systems with ease."
authors = [
    { name = "Kyrazo", email = "support@kyrazo.com" }
]
readme = "README.md"
license = "MIT"
keywords = ["kyrazo", "webhooks", "events", "sdk", "api", "event-driven", "webhooks-as-a-service"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Communications :: Chat",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
]

[project.urls]
Homepage = "https://kyrazo.com"
Documentation = "https://docs.kyrazo.com"
Repository = "https://github.com/kyrazolabs/sdks"
"Bug Tracker" = "https://github.com/kyrazolabs/sdks/issues"
Source = "https://github.com/kyrazolabs/sdks/tree/main/sdks/python"

[tool.poetry]
packages = [{include = "kyrazo"}]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.5"
respx = "^0.20.2"
ruff = "^0.3.0"
mypy = "^1.8.0"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:pytest_asyncio.plugin",
    "ignore::DeprecationWarning:asyncio",
]
